# ARC training config

defaults:
  - arch: trm
  - _self_

hydra:
  output_subdir: null

# Data path
data_paths: ['data/arc-aug-1000']
data_paths_test: []

evaluators:
  - name: arc@ARC

# Hyperparams - Training
global_batch_size: 768

epochs: 100000
eval_interval: 10000
checkpoint_every_eval: True

lr: 1e-4
lr_min_ratio: 1.0
lr_warmup_steps: 2000

# Standard hyperparameter settings for LM, as used in Llama
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.1

# Hyperparams - Puzzle embeddings training
puzzle_emb_lr: 1e-2

seed: 0
min_eval_interval: 0 # when to start the eval
max_eval_batches: 10 # Limit number of evaluation batches (None = no limit, set to small number for quick testing)

ema: False # use Exponential-Moving-Average
ema_rate: 0.999 # EMA-rate
freeze_weights: False # If True, freeze weights and only learn the embeddings

# Few-shot training (SEAL-style)
use_few_shot: False # Enable few-shot training with vector database
num_similar_examples: 3 # Number of similar examples to fetch per puzzle
vector_db_path: null # Path to vector database file (required if use_few_shot=True)
rebuild_vector_db: False # Force rebuild vector database
meta_trm_config: null # MetaTRM architecture config (required if use_few_shot=True)
  # Example:
  #   name: recursive_reasoning.metaTRM@MetaTRM
  #   H_cycles: 2
  #   L_cycles: 2
  #   L_layers: 2
  #   hidden_size: 64
  #   num_heads: 2
  #   expansion: 4
  #   pos_encodings: rope
  #   forward_dtype: bfloat16
  #   mlp_t: False
  #   puzzle_emb_ndim: 64
  #   puzzle_emb_len: 16
  #   aug_slots: 6
  #   choices_per_slot: 2
meta_trm_checkpoint: null # Path to MetaTRM checkpoint (optional)
grid_height: 9 # Height of grid for augmentation
grid_width: 9 # Width of grid for augmentation